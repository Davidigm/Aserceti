<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Alumno</title>
    <link rel="stylesheet" href="StyleInicioSesionAlumno.css">
    <script src="scriptLoginAlumno.js" defer></script>
</head>
<body>

<header class="BarraSuperior">
    <img src="recursos/GobiernoDeMExico.png" alt="Gobierno de México" class="logo">
</header>

<main class="login-main">

    <div class="login-image">
        <div class="image-title">
            Control de asesorías alumno
        </div>
    </div>

    <div class="login-right">
        <div class="login-container">

            <div class="login-title">
                Iniciar Sesión Alumno
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" placeholder="Usuario" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <a href="CambioContraseañaAlumno.html" class="login-link">¿Olvidaste tu contraseña?</a>

        </div>
    </div>

</main>
</body>
</html>
