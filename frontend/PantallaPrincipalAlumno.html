<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pantalla Principal - Alumno</title>
    <link rel="stylesheet" href="PantallaPrincipalAlumno.css">

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contenedor-principal">

        <!-- Menú lateral izquierdo -->
        <aside class="menu-lateral">
            <div class="perfil">
                <p>Alumno</p>
            </div>

            <ul class="menu-opciones">
                <li>Horario</li>
                <li>Solicitar asesoría</li>
                <li>Evaluaciones</li>
                <li>Cerrar sesión</li>
            </ul>
        </aside>

        <!-- Contenido central -->
        <main class="contenido">

            <div class="titulo">
                <h1>Pantalla Principal del Alumno</h1>
            </div>

            <!-- Horario -->
            <div class="horario">
                <p>Horario del alumno</p>

                <table>
                    <tr>
                        <th>Hora</th>
                        <th>Lun</th>
                        <th>Mar</th>
                        <th>Mié</th>
                        <th>Jue</th>
                        <th>Vie</th>
                    </tr>

                    <tr>
                        <td>07:00</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>

                    <tr>
                        <td>08:00</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
            </div>

            <button class="btn-solicitar">
                Solicitar asesoría
            </button>

        </main>

        <!-- Panel derecho -->
        <aside class="panel-derecho">
        </aside>

    </div>

</body>
</html>
